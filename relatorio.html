<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta name="theme-color" content="#060d15" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Relatórios</title>

    <link rel="icon" type="image/png" href="img/favicon.png" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/paginas.css" />
    <link rel="stylesheet" href="css/relatorio.css" />
  </head>

  <body>
    <main class="relatorio-page">
      <!-- TOPO -->
      <section class="relatorio-topo">
        <h1>Relatórios</h1>

        <button
          id="btnCalendario"
          class="relatorio-calendario"
          type="button"
          aria-label="Abrir calendário"
        >
          📅
        </button>
      </section>

      <!-- ABAS -->
      <section class="relatorio-abas">
        <button class="aba-periodo ativa" data-periodo="dia" type="button">
          Dia
        </button>

        <button class="aba-periodo" data-periodo="semana" type="button">
          Semana
        </button>

        <button class="aba-periodo" data-periodo="mes" type="button">
          Mês
        </button>

        <button class="aba-periodo" data-periodo="ano" type="button">
          Ano
        </button>
      </section>

      <!-- PERÍODO SELECIONADO -->
      <section class="periodo-selecionado">
        <button id="btnPeriodoAnterior" class="btn-periodo" type="button">
          ‹
        </button>

        <div class="info-periodo">
          <strong id="textoPeriodoSelecionado">Hoje</strong>
          <span id="subtituloPeriodo"></span>
        </div>

        <button id="btnPeriodoSeguinte" class="btn-periodo" type="button">
          ›
        </button>
      </section>

      <!-- FATURAMENTO -->
      <section class="card-relatorio card-faturamento">
        <div class="faturamento-topo">
          <div>
            <span class="card-label">Faturamento</span>

            <strong id="faturamentoPeriodo" class="valor-principal">
              R$ 0,00
            </strong>

            <p id="variacaoFaturamento" class="variacao-card"></p>
          </div>
        </div>

        <div class="grafico-area">
          <div class="linha-grid l1"></div>
          <div class="linha-grid l2"></div>
          <div class="linha-grid l3"></div>
          <div class="linha-grid l4"></div>

          <div id="graficoFaturamento" class="grafico-faturamento"></div>

          <div
            id="valorSelecionadoGrafico"
            class="valor-selecionado-grafico"
          ></div>
        </div>
      </section>

      <!-- MÉTRICAS PRINCIPAIS -->
      <section class="cards-metricas">
        <article class="card-relatorio metrica-card">
          <div>
            <span>Atendimentos</span>
            <strong id="totalAtendimentos">0</strong>
            <p id="variacaoAtendimentos" class="variacao-card"></p>
          </div>
        </article>

        <article class="card-relatorio metrica-card">
          <div>
            <span>Ticket médio</span>
            <strong id="ticketMedio">R$ 0,00</strong>
            <p id="variacaoTicketMedio" class="variacao-card"></p>
          </div>
        </article>
      </section>

      <!-- RECEBIMENTOS -->
      <section class="card-relatorio recebimentos-card">
        <h2>Recebimentos</h2>

        <div class="recebimentos-grid">
          <div id="recebimentoDetalhado" class="recebimentos-lista">
            <!-- Legendas e valores gerados pelo JavaScript -->
          </div>

          <div id="graficoPizzaRecebimentos" class="donut">
            <div class="donut-centro"></div>
          </div>
        </div>
      </section>

      <!-- TAXA CARTÃO -->
      <section class="card-relatorio taxas-card">
        <div class="taxas-info">
          <span>Taxas do cartão</span>
        </div>

        <div class="taxas-variacao">
          <strong id="taxaCartao">R$ 0,00</strong>
        </div>
      </section>
    </main>

    <!-- MODAL CALENDÁRIO -->
    <div id="modal-calendario" class="modal-calendario">
      <div class="calendario-container">
        <div class="calendario-topo">
          <button id="mesAnterior" class="cal-btn" type="button">‹</button>
          <span id="mesAtual" class="cal-mes">Julho 2025</span>
          <button id="mesSeguinte" class="cal-btn" type="button">›</button>
        </div>

        <div class="calendario-semana">
          <div>Dom</div>
          <div>Seg</div>
          <div>Ter</div>
          <div>Qua</div>
          <div>Qui</div>
          <div>Sex</div>
          <div>Sáb</div>
        </div>

        <div id="calendarioCorpo" class="calendario-corpo">
          <!-- Dias gerados pelo JavaScript -->
        </div>
      </div>
    </div>

    <div id="menu-container"></div>

    <script src="javaScript/relatorio.js"></script>
    <script src="javaScript/menu.js"></script>
  </body>
</html>
